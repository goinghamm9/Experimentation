name: Deploy Synforma to GitHub Pages

on:
  push:
    branches: [main, claude/synforma-loop-website-3d-ooqg1a]
    paths: ["synforma/**", ".github/workflows/synforma-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: synforma-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synforma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: synforma/package-lock.json
      - run: npm ci
      - name: Static export (base path /Experimentation)
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /Experimentation
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: synforma/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
