services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../state:/app/state
      - ../config:/app/config
    ports:
      - "127.0.0.1:8000:8000"   # localhost only: the dashboard has no login
