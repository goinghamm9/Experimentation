[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hft-agent"
version = "0.2.0"
description = "Fat-tail aware barbell portfolio engine with walk-forward validation, paper trading and Robinhood agentic execution"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mcp>=1.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
]
research = [
    "alpaca-trade-api>=3.0",
    "ib_insync>=0.9.86",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "redis>=5.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "prometheus-client>=0.20",
]

[project.scripts]
hft-agent = "engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "dashboard*", "brokers*", "core*", "utils*", "data*"]

[tool.setuptools.package-data]
dashboard = ["templates/*.html"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
